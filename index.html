<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b1220">
  <title>แผนที่ร้านค้า อ.เกษตรสมบูรณ์</title>
  <link rel="preconnect" href="https://unpkg.com">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    :root{--bg:#0b1220;--panel:#121c2e;--soft:#1b2940;--text:#f6f8fb;--muted:#a9b5c8;--green:#32d583;--line:#263652;}
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;font-family:Tahoma,"Noto Sans Thai",sans-serif;background:var(--bg);color:var(--text)}
    body{overflow:hidden}
    .app{height:100%;display:grid;grid-template-columns:390px 1fr}
    .sidebar{background:linear-gradient(180deg,#101a2b,#0b1220);border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0;z-index:1001}
    .head{padding:20px 18px 14px;border-bottom:1px solid var(--line)}
    h1{font-size:22px;margin:0 0 5px}
    .sub{color:var(--muted);font-size:13px}
    .tools{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:14px}
    input,select{border:1px solid var(--line);background:#0d1728;color:#fff;border-radius:12px;padding:11px 12px;outline:none}
    select{max-width:138px}
    .count{font-size:12px;color:var(--muted);margin-top:10px}
    .list{overflow:auto;padding:10px}
    .card{display:grid;grid-template-columns:1fr;gap:11px;background:var(--panel);border:1px solid transparent;border-radius:15px;padding:9px;margin-bottom:9px;cursor:pointer;transition:.18s}
    .card:hover,.card.active{border-color:var(--green);transform:translateY(-1px);box-shadow:0 8px 24px #0005}
    .name{font-weight:700;font-size:15px;margin:2px 0 4px}
    .meta{font-size:12px;color:var(--muted);line-height:1.45}
    .btns{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}
    .btn{display:inline-block;text-decoration:none;border-radius:9px;padding:7px 9px;font-size:12px;font-weight:700}
    .gm{background:var(--green);color:#052515}
    .nav{background:#21314c;color:#fff;border:1px solid #344969}
    #map{height:100%;width:100%}
    .leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#111b2c;color:#fff}
    .popup{width:245px}
    .popup h3{margin:0 0 5px;font-size:17px}
    .popup p{margin:0 0 8px;color:#bac6d8;line-height:1.5}
    .marker-bubble{width:32px;height:32px;background:#ef4444;border:3px solid #fff;border-radius:50% 50% 50% 0;transform:rotate(-45deg);box-shadow:0 4px 12px #0007}
    .marker-bubble span{display:block;transform:rotate(45deg);text-align:center;line-height:26px;font-weight:700;color:#fff;font-size:11px}
    .mobile-toggle{display:none;position:absolute;z-index:1100;top:12px;left:12px;background:#0b1220;color:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-weight:700}
    .credit{position:absolute;right:12px;bottom:12px;z-index:900;background:#0b1220dd;border:1px solid var(--line);padding:7px 10px;border-radius:10px;font-size:11px;color:var(--muted)}
    @media(max-width:820px){
      .app{grid-template-columns:1fr}
      .sidebar{position:absolute;inset:0 auto 0 0;width:min(92vw,390px);transform:translateX(-102%);transition:.25s;box-shadow:10px 0 35px #0008}
      .sidebar.open{transform:none}
      .mobile-toggle{display:block}
      .credit{display:none}
    }
  </style>
</head>
<body>
<button class="mobile-toggle" id="toggle">☰ ร้านค้า</button>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="head">
      <h1>📍 แผนที่ร้านค้า</h1>
      <div class="sub">อำเภอเกษตรสมบูรณ์ จังหวัดชัยภูมิ</div>
      <div class="tools">
        <input id="search" placeholder="ค้นหาชื่อร้าน...">
        <select id="category"><option value="">ทุกประเภท</option></select>
      </div>
      <div class="count" id="count"></div>
    </div>
    <div class="list" id="list"></div>
  </aside>
  <main id="map"></main>
</div>
<div class="credit">ตำแหน่งอ้างอิงจากพิกัดบนภาพที่ให้มา</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const stores = [{"name":"กิจรุ่งเรืองการช่าง 2","lat":16.27817,"lng":101.9601,"category":"อะไหล่และการช่าง","area":"ต.บ้านยาง อ.เกษตรสมบูรณ์ จ.ชัยภูมิ"},{"name":"ช.ยารวมอะไหล่","lat":16.28326,"lng":101.93186,"category":"อะไหล่และแบตเตอรี่","area":"ต.บ้านยาง อ.เกษตรสมบูรณ์ จ.ชัยภูมิ"},{"name":"ช.เจริญยนต์","lat":16.14745,"lng":101.9075,"category":"อะไหล่และน้ำมันเครื่อง","area":"ต.บ้านเดื่อ อ.เกษตรสมบูรณ์ จ.ชัยภูมิ"},{"name":"นิคมจักรยาน","lat":16.28008,"lng":101.95067,"category":"จักรยานและอะไหล่","area":"ต.บ้านยาง อ.เกษตรสมบูรณ์ จ.ชัยภูมิ"},{"name":"นิยมเกษตร","lat":16.28033,"lng":101.94791,"category":"การเกษตรและอะไหล่","area":"ต.บ้านยาง อ.เกษตรสมบูรณ์ จ.ชัยภูมิ"},{"name":"ปั๊มหมื่น (จ่าหมื่น)","lat":16.14711,"lng":101.90768,"category":"สถานีบริการน้ำมัน","area":"ต.บ้านเดื่อ อ.เกษตรสมบูรณ์ จ.ชัยภูมิ"},{"name":"ฟิวเรซซิ่งช้อป","lat":16.28002,"lng":101.95239,"category":"อะไหล่และแต่งรถ","area":"ต.บ้านยาง อ.เกษตรสมบูรณ์ จ.ชัยภูมิ"},{"name":"จินดา","lat":16.29386,"lng":101.94595,"category":"น้ำมันเครื่องและสินค้าเกษตร","area":"ต.กุดเลาะ อ.เกษตรสมบูรณ์ จ.ชัยภูมิ"},{"name":"จ่าหมื่น (ปั๊ม)","lat":16.14722,"lng":101.90789,"category":"สถานีบริการน้ำมัน","area":"ต.บ้านเดื่อ อ.เกษตรสมบูรณ์ จ.ชัยภูมิ"},{"name":"ช.การเกษตร","lat":16.28326,"lng":101.93179,"category":"การเกษตรและเครื่องมือ","area":"ต.บ้านยาง อ.เกษตรสมบูรณ์ จ.ชัยภูมิ"},{"name":"นาไฮการยาง","lat":16.3283,"lng":102.05679,"category":"ยางและน้ำมันเครื่อง","area":"ต.บ้านหัน อ.เกษตรสมบูรณ์ จ.ชัยภูมิ"},{"name":"สินสมบูรณ์","lat":16.19284,"lng":101.89858,"category":"ร้านค้า","area":"ต.หนองข่า อ.เกษตรสมบูรณ์ จ.ชัยภูมิ"},{"name":"สุขสันต์ก่อสร้าง","lat":16.28187,"lng":101.94133,"category":"วัสดุก่อสร้าง","area":"ต.กุดเลาะ อ.เกษตรสมบูรณ์ จ.ชัยภูมิ"},{"name":"เจริญชัย","lat":16.27998,"lng":101.95318,"category":"เครื่องมือและอุปกรณ์","area":"ต.บ้านยาง อ.เกษตรสมบูรณ์ จ.ชัยภูมิ"},{"name":"เมืองใหม่การเกษตร","lat":16.29308,"lng":101.94531,"category":"ปุ๋ยและเคมีเกษตร","area":"ต.กุดเลาะ อ.เกษตรสมบูรณ์ จ.ชัยภูมิ"},{"name":"สมชัยคูโบต้า","lat":16.27841,"lng":101.95474,"category":"อะไหล่รถการเกษตร","area":"ต.บ้านยาง อ.เกษตรสมบูรณ์ จ.ชัยภูมิ"},{"name":"อุดรเจริญยนต์","lat":16.28352,"lng":101.93154,"category":"ยางและศูนย์บริการ","area":"ต.บ้านยาง อ.เกษตรสมบูรณ์ จ.ชัยภูมิ"},{"name":"เจ.เจ.เจริญยนต์","lat":16.27806,"lng":101.9567,"category":"ซ่อมรถและอะไหล่","area":"ต.บ้านยาง อ.เกษตรสมบูรณ์ จ.ชัยภูมิ"},{"name":"โรงกลึงนิยม","lat":16.28061,"lng":101.94425,"category":"โรงกลึงและอะไหล่","area":"ต.บ้านยาง อ.เกษตรสมบูรณ์ จ.ชัยภูมิ"}];
const map=L.map('map',{zoomControl:true}).setView([16.2785,101.9475],13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
const listEl=document.getElementById('list'),searchEl=document.getElementById('search'),catEl=document.getElementById('category'),countEl=document.getElementById('count'),sidebar=document.getElementById('sidebar'),markers=[];
[...new Set(stores.map(s=>s.category))].sort().forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c;catEl.appendChild(o)});
function mapsUrl(s){return `https://www.google.com/maps/search/?api=1&query=${s.lat},${s.lng}`}
function routeUrl(s){return `https://www.google.com/maps/dir/?api=1&destination=${s.lat},${s.lng}&travelmode=driving`}
function icon(n){return L.divIcon({className:'',html:`<div class="marker-bubble"><span>${n}</span></div>`,iconSize:[32,32],iconAnchor:[16,32],popupAnchor:[0,-30]})}
stores.forEach((s,i)=>{const popup=`<div class="popup"><h3>${s.name}</h3><p>${s.category}<br>${s.area}<br>พิกัด ${s.lat.toFixed(5)}, ${s.lng.toFixed(5)}</p><div class="btns"><a class="btn gm" target="_blank" href="${mapsUrl(s)}">เปิด Google Maps</a><a class="btn nav" target="_blank" href="${routeUrl(s)}">นำทาง</a></div></div>`;const m=L.marker([s.lat,s.lng],{icon:icon(i+1)}).addTo(map).bindPopup(popup);markers.push(m)});
function render(){const q=searchEl.value.trim().toLowerCase(),c=catEl.value;listEl.innerHTML='';let shown=0;markers.forEach(m=>map.removeLayer(m));stores.forEach((s,i)=>{const ok=(!q||(s.name+s.category+s.area).toLowerCase().includes(q))&&(!c||s.category===c);if(!ok)return;shown++;markers[i].addTo(map);const card=document.createElement('article');card.className='card';card.innerHTML=`<div><div class="name">${i+1}. ${s.name}</div><div class="meta">${s.category}<br>${s.area}</div><div class="btns"><a class="btn gm" target="_blank" href="${mapsUrl(s)}" onclick="event.stopPropagation()">Google Maps</a><a class="btn nav" target="_blank" href="${routeUrl(s)}" onclick="event.stopPropagation()">นำทาง</a></div></div>`;card.onclick=()=>{document.querySelectorAll('.card').forEach(x=>x.classList.remove('active'));card.classList.add('active');map.setView([s.lat,s.lng],17,{animate:true});markers[i].openPopup();if(innerWidth<821)sidebar.classList.remove('open')};listEl.appendChild(card)});countEl.textContent=`แสดง ${shown} จาก ${stores.length} ร้าน`}
searchEl.addEventListener('input',render);catEl.addEventListener('change',render);document.getElementById('toggle').onclick=()=>sidebar.classList.toggle('open');map.on('click',()=>{if(innerWidth<821)sidebar.classList.remove('open')});map.fitBounds(L.latLngBounds(stores.map(s=>[s.lat,s.lng])).pad(.12));render();
</script>
</body>
</html>
